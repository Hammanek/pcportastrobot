# Trapped in Time - Serpent Starway: platforms not flipping consistently
# The platform flip logic uses a timer that can desync at lower frame rates
# Patch the flip timer to use frame-accurate timing instead of wall-clock time
format = 1

[[patch]]
name        = "trapped_in_time_platform_flip_fix"
target      = "eboot.elf"
va          = 0x12345678  # PLACEHOLDER - needs RE to find actual address
expected    = "xxxxxxxx"  # PLACEHOLDER
value       = "xxxxxxxx"  # PLACEHOLDER
description = "Fix platform flip timing in Trapped in Time level to work at all frame rates"

