name: Bug Report
description: Report a crash, freeze, or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below with as much detail as possible.
        
        **Before submitting:**
        - Check if the issue already exists (open or closed)
        - Try the latest release from GitHub
        - Generate a crash report using the launcher (it copies to clipboard automatically on crash)

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of issue are you experiencing?
      options:
        - Game crash (closes to desktop)
        - Game freeze/hang (requires force close)
        - Vulkan Device Lost (Error 321)
        - Launcher crash
        - Level-specific bug (missing geometry, can't progress)
        - Physics/collision issue
        - Performance issue (low FPS, stutter, slow loads)
        - Texture/rendering issue
        - Controller/input issue
        - Audio issue
        - Other
    validations:
      required: true

  - type: input
    id: astrohybrid-version
    attributes:
      label: AstroHybrid Version
      description: Version from the launcher title bar (e.g., 1.2.6)
      placeholder: "1.2.6"
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game Version
      description: Version of your Astro Bot dump (e.g., 01.019.000 PPSA21567)
      placeholder: "01.019.000 PPSA21567"
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware Specs
      description: Your PC specifications
      placeholder: |
        CPU: Intel Core i7-11800H / AMD Ryzen 7 5800X3D
        GPU: NVIDIA RTX 3080 Laptop / AMD RX 6800 XT
        VRAM: 16 GB / 8 GB
        RAM: 32 GB DDR4-3200
        OS: Windows 11 Pro 22H2 / Linux (distro)
    validations:
      required: true

  - type: dropdown
    id: gpu-vendor
    attributes:
      label: GPU Vendor
      options:
        - NVIDIA
        - AMD
        - Intel
        - Other
    validations:
      required: true

  - type: dropdown
    id: launch-method
    attributes:
      label: Launch Method
      description: How did you launch the game?
      options:
        - Launcher (Play button)
        - Run-AstroHybrid.bat
        - Run-AstroHybrid-DLSS.bat
        - Run-AstroHybrid-FG.bat
        - Run-AstroHybrid-Linux.sh (Wine/Proton)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Clear description of the issue...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue
      placeholder: |
        1. Launch game
        2. Go to level X
        3. Do action Y
        4. Crash occurs
    validations:
      required: true

  - type: textarea
    id: crash-report
    attributes:
      label: Crash Report
      description: Paste the crash report generated by the launcher (copied to clipboard on crash), or attach log files
      placeholder: |
        Paste crash report here...
      render: text
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log Files
      description: Attach relevant log files from the Logs/ folder (astrohybrid-debug.log, hybrid-run.out.log, hybrid-run.err.log)
      placeholder: |
        Drag and drop log files here, or paste relevant excerpts
      render: text
    validations:
      required: false

  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting Already Attempted
      options:
        - label: Updated GPU drivers to latest version
        - label: Verified game dump integrity
        - label: Tried running with default settings (no DLSS/Frame Gen/Ultrawide)
        - label: Cleared shader cache (deleted Logs/ folder)
        - label: Rebuilt RunHybrid (python -I Tools/hybrid/make_run_hybrid.py)
        - label: Tested on different GPU (if available)

  - type: dropdown
    id: settings
    attributes:
      label: Graphics Settings
      description: What graphics settings were you using?
      options:
        - Default/Auto
        - DLSS Quality
        - DLSS Balanced
        - DLSS Performance
        - Frame Generation (2x/3x/4x)
        - Ultrawide (21:9)
        - Super Ultrawide (32:9)
        - Low Latency / Reflex enabled
        - Custom settings