name: Crash Report
description: Submit a crash report generated by the launcher
title: "[Crash] "
labels: ["bug", "crash"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for submitting crash reports generated by the AstroHybrid launcher.
        The launcher automatically generates a crash report and copies it to your clipboard when the game crashes.
        
        **Just paste the crash report below!**

  - type: textarea
    id: crash-report
    attributes:
      label: Crash Report
      description: Paste the full crash report from your clipboard (Ctrl+V)
      placeholder: |
        === AstroHybrid Crash Report ===
        Generated: 2026-11-20 15:30:45
        Exit Code: 321 (Vulkan Device Lost (TDR) - GPU timeout)
        ...
      render: text
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Crash Frequency
      options:
        - Every launch
        - After specific time (30-60 min gameplay)
        - At specific level/location
        - Random/Intermittent
        - Only with specific settings (DLSS/Frame Gen/Ultrawide)
    validations:
      required: true

  - type: checkboxes
    id: related
    attributes:
      label: Related to Known Issues?
      options:
        - label: Error 321 / Vulkan Device Lost (#154, #65, #6)
        - label: Launcher crash on startup (#137, #110)
        - label: Level end freeze (#130)
        - label: Physics collision at sub-60 FPS (#125)
        - label: Specific level crash (#148, #134, #132, #116)
        - label: New/Unknown crash