  <text x="174" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800" letter-spacing=".4">SUPPORT ASTROHYBRID</text>
  <text x="176" y="111" fill="#fff" fill-opacity=".96" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600">Help fund development, optimisation &amp; testing</text>
