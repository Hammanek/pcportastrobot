<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Support AstroHybrid on Ko-fi</title>
  <desc id="desc">A large coral button inviting visitors to support AstroHybrid development on Ko-fi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b65"/>
      <stop offset="1" stop-color="#e94754"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#7a1e2a" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="744" height="174" rx="25" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="94" cy="94" r="54" fill="#fff" fill-opacity=".16"/>
